# SyncCart camera source examples (documentation only)
# Secrets belong in .env or a deployment secret manager, never in Git.

production_cctv_direct:
  camera_id: EDGE-CAM-01
  source_name: Aisle 4 Shelf Camera
  stream_mode: RTSP
  source: rtsp://USER:PASSWORD@CAMERA_IP:554/STREAM_PATH
  backend: FFMPEG
  buffer_size: 1

production_nvr_channel:
  camera_id: EDGE-CAM-02
  source_name: Aisle 5 NVR Channel 12
  stream_mode: RTSP
  source: rtsp://USER:PASSWORD@NVR_IP:554/CHANNEL_PATH
  backend: FFMPEG
  buffer_size: 1

hackathon_phone1:
  camera_id: PHONE-1-SHELF-CAM
  source_name: Phone 1 IP Webcam
  stream_mode: HTTP_MJPEG
  source: http://PHONE_IP:8080/video
  backend: AUTO
  buffer_size: 1

local_webcam:
  camera_id: DEV-WEBCAM-01
  source_name: Laptop Webcam
  stream_mode: WEBCAM
  source: "0"
  backend: AUTO
  buffer_size: 1
