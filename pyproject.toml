[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synccart-ai"
version = "1.0.0"
description = "SyncCart AI industrial-grade retail cart reconciliation platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.128,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy>=2.0.45,<2.1",
  "alembic>=1.17,<2.0",
  "pydantic>=2.12,<3.0",
  "pydantic-settings>=2.11,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=9.0,<10.0",
  "pytest-cov>=7.0,<8.0",
  "ruff>=0.14,<1.0",
  "mypy>=1.18,<2.0",
]

[tool.setuptools.packages.find]
where = ["services/api"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["services/api", "services/vision"]
testpaths = ["services/api/tests", "services/vision/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
exclude = ["services/api/migrations"]
