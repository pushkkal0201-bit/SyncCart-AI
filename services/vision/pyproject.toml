[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synccart-vision"
version = "1.0.0"
description = "SyncCart AI retail edge Vision worker for CCTV/NVR and hackathon camera streams"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.128,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "httpx>=0.28,<1.0",
  "numpy>=2.0,<3.0",
  "opencv-python>=4.10,<5.0",
  "pydantic>=2.12,<3.0",
  "pydantic-settings>=2.11,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3,<9.0"]
dev = ["pytest>=9.0,<10.0", "ruff>=0.14,<1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["synccart_vision*"]
